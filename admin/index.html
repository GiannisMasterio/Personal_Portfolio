<!DOCTYPE html>
<html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin — Portfolio CMS</title>
<style>
:root{--bg:#0a0a0a;--card:#111;--line:#222;--txt:#f1f1f1;--mut:#9a9a9a;--pur:#b620e0;--yel:#ffd400}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
button{font:inherit;cursor:pointer}aside{border-right:1px solid var(--line);padding:20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside h1{font-size:15px;margin-bottom:12px}aside .tab{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:9px 12px;border-radius:10px}
aside .tab.on,aside .tab:hover{background:#1a1a1a;color:#fff}aside .sp{flex:1}
main{padding:32px;max-width:860px}main h2{font-size:22px;margin-bottom:18px}
.btn{background:#1f1f1f;color:#fff;border:1px solid #333;border-radius:10px;padding:8px 14px}.btn.p{background:var(--yel);color:#000;border:0;font-weight:600}.btn.d{color:#ff7b7b}
.fld{margin-bottom:14px}.fld label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
input,textarea,select{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;color:#fff;font:inherit}textarea{min-height:90px}
.row{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.row img{width:64px;height:40px;object-fit:cover;border-radius:6px;background:#222}.row .t{flex:1;min-width:0}.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev{max-height:110px;border-radius:10px;margin-bottom:6px;display:block;border:1px solid #333}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:9}
.dlg{background:#141414;border:1px solid #333;border-radius:16px;padding:22px;width:100%;max-width:620px}.dlg h3{margin-bottom:16px}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.brow{display:grid;grid-template-columns:90px 1fr auto;gap:8px;margin-bottom:8px}
.hint{background:#1a1500;border:1px solid #4a3d00;color:#ffe680;padding:12px 14px;border-radius:12px;margin-bottom:20px;font-size:13px}
@media(max-width:760px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.sp{display:none}}
</style></head><body>
<aside id="side"></aside><main id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../data/content.js"></script>
<script src="admin.js"></script></body></html>
